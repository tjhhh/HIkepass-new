<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="login-page">

        <div class="split-right">
            <div class="content">
                <h1>Selamat Datang Admin<br>di Hikepass!</h1>
                <p>Register sekarang! untuk menikmati Semua<br>fitur yang tersedia di Hikepass.</p>
                <button class="white-btn" id="userBtn">USER</button>
            </div>
        </div>

        <div class="split-left">
            <div class="content" id="formContainer">
                <!-- ===== FORM SIGN IN ===== -->
                <div id="signInForm">
                    <h2>Sign In</h2>

                    <div class="input-group">
                        <input type="email" placeholder="Email">
                    </div>

                    <div class="input-group">
                        <input type="password" id="password" placeholder="Password">
                        <img src="assets/hide.svg" id="togglePassword" class="toggle-password" alt="Show Password">
                    </div>

                    <p class="forgot">Lupa kata sandi Anda?</p>

                    <button class="signin-btn">SIGN IN</button>

                    <div class="divider">
                        <span></span>
                        <p>Belum punya akun?</p>
                        <span></span>
                    </div>

                    <button class="white-btn" id="showRegister">SIGN UP</button>
                </div>

                <!-- ===== FORM REGISTER ===== -->
                <div id="registerForm" style="display: none;">
                    <h2>Register</h2>

                    <div class="input-group">
                        <input type="text" placeholder="Nama Lengkap">
                    </div>

                    <div class="input-group">
                        <input type="email" placeholder="Email">
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Password">
                    </div>

                    <div class="input-group">
                        <input type="password" placeholder="Konfirmasi Password">
                    </div>

                    <button class="signin-btn">DAFTAR</button>

                    <div class="divider">
                        <span></span>
                        <p>Sudah punya akun?</p>
                        <span></span>
                    </div>

                    <button class="white-btn" id="showLogin">SIGN IN</button>
                </div>
            </div>
        </div>

    </div>
    <script src="script/script.js"></script>
</body>

</html>
