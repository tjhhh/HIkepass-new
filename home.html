<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Hikepass</title>
</head>

<body>

    <header class="navbar">
        <div class="navbar__logo">
            <img src="assets/logoHikepass.svg" alt="Logo HikePass">
            <h2>HikePass</h2>
        </div>
        <nav class="navbar__menu">
            <a href="home.html">Home</a>
            <a href="reservasi.html">Reservasi</a>
            <a href="#">Tiket Saya</a>
        </nav>
        <div class="navbar__search">
            <p>Hai, Yanto</p>
            <img src="assets/avatarUSer.png" alt="Avatar Yanto">
        </div>
    </header>

    <main>
        <section class="page-banner page-banner--home">
            <div class="page-banner__container">

                <div>
                    <h1 class="page-banner__home-title">Ticketing Pendakian Gunung</h1>
                    <p class="page-banner__home-subtitle">
                        Tempat pemesanan tiket pendakian gunung di Indonesia
                    </p>
                </div>
                <div class="page-banner__search-wrapper">
                    <form class="search-form">
                        <input type="text" class="search-form__input" placeholder="Cari nama gunung atau lokasi...">
                    </form>
                </div>

                <img class="page-banner__bg" alt="">
                <h2 class="page-banner__title"></h2>
                <div class="page-banner__search-wrapper"></div>

            </div>
        </section>

        <section class="features container">
            <div class="features__container">
                <button class="feature-card" id="btn-reservasi">
                    <img src="assets/iconTicket.svg" alt="">
                    <h3>Reservasi</h3>
                </button>

                <button class="feature-card" id="btn-riwayat">
                    <img src="assets/iconRiwayat.svg" alt="">
                    <h3>Riwayat</h3>
                </button>

                <button class="feature-card" id="btn-informasi">
                    <img src="assets/iconInformasi.svg" alt="">
                    <h3>Informasi</h3>
                </button>

                <button class="feature-card" id="btn-laporan">
                    <img src="assets/iconAlert.svg" alt="">
                    <h3>Laporan</h3>
                </button>
            </div>
        </section>
    </main>

    <script src="script/script.js"></script>
</body>

</html>
